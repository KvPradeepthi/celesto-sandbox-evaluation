services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      DATABASE_PATH: ${DATABASE_PATH:-/data/runs.db}
      CELESTO_BACKEND: ${CELESTO_BACKEND:-firecracker}
      SANDBOX_MODE: ${SANDBOX_MODE:-mock}
      RUN_TIMEOUT_SECONDS: ${RUN_TIMEOUT_SECONDS:-30}
      MAX_CONCURRENT_RUNS: ${MAX_CONCURRENT_RUNS:-4}
    volumes:
      - run-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

volumes:
  run-data:
